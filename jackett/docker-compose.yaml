services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    restart: unless-stopped
    environment:
      PGID: ${PGID}
      TZ: ${TZ}
      PUID: ${PUID}
    volumes:
    - ${JACKETT_BIND_1}:/config
    - ${JACKETT_BIND_2}:/downloads
    ports:
    - ${BIND_ADDRESS}:${JACKETT_PORT_9117}:9117
