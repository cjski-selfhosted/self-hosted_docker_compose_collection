services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
    - ${SONARR_BIND_1}:/config
    - ${SONARR_BIND_2}:/downloads
    ports:
    - ${BIND_ADDRESS}:${SONARR_PORT_8989}:8989
