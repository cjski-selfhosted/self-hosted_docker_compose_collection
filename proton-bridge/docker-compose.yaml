services:
  protonmail-bridge:
    image: shenxn/protonmail-bridge:latest
    restart: unless-stopped
    volumes:
    - volume_1:/root
    ports:
    - ${BIND_ADDRESS}:${PROTONMAIL_BRIDGE_PORT_143}:143
    - ${BIND_ADDRESS}:${PROTONMAIL_BRIDGE_PORT_25}:25
volumes:
  volume_1:
    name: ${VOLUME_1_NAME}
