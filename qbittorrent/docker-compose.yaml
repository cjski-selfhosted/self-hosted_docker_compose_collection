services:
  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    environment:
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_EXTRA_ARGS: ${OPENVPN_EXTRA_ARGS}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      UPDATER_PROTONVPN_PASSWORD: ${UPDATER_PROTONVPN_PASSWORD}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING}
      UPDATER_PROTONVPN_USERNAME: ${UPDATER_PROTONVPN_USERNAME}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
    volumes:
    - ${GLUETUN_BIND_1}:/gluetun
    ports:
    - ${BIND_ADDRESS}:${GLUETUN_PORT_49893}:49893
    - ${BIND_ADDRESS}:${GLUETUN_PORT_6881}:6881
    - ${BIND_ADDRESS}:${GLUETUN_PORT_6881_UDP}:6881/udp
    cap_add:
    - CAP_NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun:rwm
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${WEBUI_PORT}
      TORRENTING_PORT: ${TORRENTING_PORT}
    volumes:
    - ${QBITTORRENT_BIND_1}:/config
    - ${QBITTORRENT_BIND_2}:/downloads
    - ${QBITTORRENT_BIND_3}:/downloads/audiobook
    - ${QBITTORRENT_BIND_4}:/downloads/ebook
    - ${QBITTORRENT_BIND_5}:/downloads/games
    - ${QBITTORRENT_BIND_6}:/downloads/movies
    - ${QBITTORRENT_BIND_7}:/downloads/other
    - ${QBITTORRENT_BIND_8}:/downloads/series
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
