services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.7
    restart: unless-stopped
    ports:
    - 80:80
    volumes:
    - ${NGINX_PROXY_BIND_1}:/tmp/docker.sock:ro
    - ${NGINX_PROXY_BIND_2}:/etc/nginx/certs:ro
    - ${NGINX_PROXY_BIND_3}:/etc/nginx/vhost.d
    - ${NGINX_PROXY_BIND_4}:/usr/share/nginx/html
