services:
  nextcloud:
    image: nextcloud:latest
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    restart: always
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
    - volume_1:/var/www/html
    ports:
    - ${BIND_ADDRESS}:${NEXTCLOUD_PORT_80}:80
    depends_on:
      db:
        condition: service_started
  db:
    image: mariadb:10.6
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    command:
    - --transaction-isolation=READ-COMMITTED
    - --log-bin=binlog
    - --binlog-format=ROW
    volumes:
    - volume_2:/var/lib/mysql
volumes:
  volume_1:
    name: ${VOLUME_1_NAME}
  volume_2:
    name: ${VOLUME_2_NAME}
