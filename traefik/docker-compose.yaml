services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
    - --configfile=/traefik.yml
    ports:
    - ${HTTP_BIND_ADDRESS}:80:80
    - ${HTTPS_BIND_ADDRESS}:443:443
    - ${HTTPS_BIND_ADDRESS}:443:443/udp
    - ${TUNNEL_HTTP_BIND_ADDRESS}:8081:8081
    - ${TUNNEL_HTTPS_BIND_ADDRESS}:8443:8443
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    volumes:
    - ${TRAEFIK_CONFIG_FILE}:/traefik.yml:ro
    - ${TRAEFIK_DYNAMIC_DIR}:/dynamic:ro
    - ${TRAEFIK_ACME_DIR}:/letsencrypt
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ${TRAEFIK_CERTS_DIR}:/certs:ro
    networks:
    - proxy
    healthcheck:
      test:
      - CMD
      - traefik
      - healthcheck
      - --ping
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
