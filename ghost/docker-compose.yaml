services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    volumes:
    - volume_1:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD"
      interval: 5000000000ns
      timeout: 20000000000ns
      retries: 10
  ghost:
    image: ghost:5
    restart: unless-stopped
    environment:
      mail__transport: ${MAIL__TRANSPORT}
      mail__options__auth__user: ${MAIL__OPTIONS__AUTH__USER}
      mail__options__secure: ${MAIL__OPTIONS__SECURE}
      database__client: ${DATABASE__CLIENT}
      mail__options__service: ${MAIL__OPTIONS__SERVICE}
      mail__options__host: ${MAIL__OPTIONS__HOST}
      url: ${URL}
      database__connection__user: ${DATABASE__CONNECTION__USER}
      database__connection__password: ${MYSQL_PASSWORD}
      mail__from: ${MAIL__FROM}
      database__connection__database: ${DATABASE__CONNECTION__DATABASE}
      MAIL_OPTIONS_AUTH_USER: ${MAIL_OPTIONS_AUTH_USER}
      database__connection__host: ${DATABASE__CONNECTION__HOST}
      mail__options__auth__pass: ${MAIL__OPTIONS__AUTH__PASS}
      mail__options__port: ${MAIL__OPTIONS__PORT}
      mail__options__tls__rejectUnauthorized: ${MAIL__OPTIONS__TLS__REJECTUNAUTHORIZED}
      MAIL_OPTIONS_AUTH_PASS: ${MAIL_OPTIONS_AUTH_PASS}
    volumes:
    - volume_2:/var/lib/ghost/content
    ports:
    - ${BIND_ADDRESS}:${WEB_PORT}:2368
    healthcheck:
      test:
      - CMD
      - echo
      - ok
      interval: 5000000000ns
      timeout: 20000000000ns
      retries: 10
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  volume_1:
    name: ${VOLUME_1_NAME}
  volume_2:
    name: ${VOLUME_2_NAME}
