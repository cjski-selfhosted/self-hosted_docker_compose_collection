services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
    - ${RADARR_BIND_1}:/config
    - ${RADARR_BIND_2}:/recycle
    ports:
    - ${BIND_ADDRESS}:${RADARR_PORT_7878}:7878
