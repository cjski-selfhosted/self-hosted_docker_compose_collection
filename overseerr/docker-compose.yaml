services:
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    restart: unless-stopped
    environment:
      BASE_URL: ${BASE_URL}
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
    - ${OVERSEERR_BIND_1}:/config
    ports:
    - ${BIND_ADDRESS}:${OVERSEERR_PORT_5055}:5055
