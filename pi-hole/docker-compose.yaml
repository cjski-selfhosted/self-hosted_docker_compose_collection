services:
  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${FTLCONF_WEBSERVER_API_PASSWORD}
      FTLCONF_dns_listeningMode: ${FTLCONF_DNS_LISTENINGMODE}
    volumes:
    - ${PIHOLE_BIND_1}:/etc/pihole
    ports:
    - ${BIND_ADDRESS}:${PIHOLE_PORT_53}:53
    - ${BIND_ADDRESS}:${PIHOLE_PORT_53_UDP}:53/udp
    - ${BIND_ADDRESS}:${PIHOLE_PORT_80}:80
    cap_add:
    - NET_ADMIN
    - SYS_TIME
    - SYS_NICE
