services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DOMAINS: ${DOMAINS}
      IP4_PROVIDER: ${IP4_PROVIDER}
      PROXY: ${PROXY}
      TTL: ${TTL}
      LOG_LEVEL: ${LOG_LEVEL}
