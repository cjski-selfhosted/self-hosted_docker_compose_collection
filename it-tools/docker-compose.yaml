services:
  it-tools:
    image: corentinth/it-tools:latest
    restart: unless-stopped
    volumes:
    - volume_1:/app/data
    ports:
    - ${BIND_ADDRESS}:${WEB_PORT}:80
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://127.0.0.1:80
      interval: 30000000000ns
      timeout: 10000000000ns
      retries: 3
volumes:
  volume_1:
    name: ${VOLUME_1_NAME}
