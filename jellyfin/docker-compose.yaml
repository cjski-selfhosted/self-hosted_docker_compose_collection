services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    restart: unless-stopped
    environment:
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHEDSERVERURL}
    user: 1000:1000
    volumes:
    - ${JELLYFIN_BIND_1}:/cache
    - ${JELLYFIN_BIND_2}:/config
    - ${JELLYFIN_BIND_3}:/media/movies
    - ${JELLYFIN_BIND_4}:/media/series
    - ${JELLYFIN_BIND_5}:/usr/local/share/fonts/custom:ro
    ports:
    - ${BIND_ADDRESS}:${WEB_PORT}:8096
    extra_hosts:
    - ${JELLYFIN_EXTRA_HOSTS_1}
