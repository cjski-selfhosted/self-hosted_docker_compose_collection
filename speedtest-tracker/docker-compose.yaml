services:
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    restart: unless-stopped
    environment:
      DB_CONNECTION: ${DB_CONNECTION}
      SPEEDTEST_SCHEDULE: ${SPEEDTEST_SCHEDULE}
      PUID: ${PUID}
      PGID: ${PGID}
      APP_KEY: ${APP_KEY}
    volumes:
    - ${SPEEDTEST_TRACKER_BIND_1}:/config
    ports:
    - ${BIND_ADDRESS}:${SPEEDTEST_TRACKER_PORT_443}:443
    - ${BIND_ADDRESS}:${SPEEDTEST_TRACKER_PORT_80}:80
