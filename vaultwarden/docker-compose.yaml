services:
  vaultwarden:
    image: vaultwarden/server:latest
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
    - ${VAULTWARDEN_BIND_1}:/data
    ports:
    - ${BIND_ADDRESS}:${VAULTWARDEN_PORT_80}:80
