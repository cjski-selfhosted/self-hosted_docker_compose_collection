services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    restart: unless-stopped
    environment:
      VERSION: ${VERSION}
      PLEX_CLAIM: ${PLEX_CLAIM}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
    - ${PLEX_BIND_1}:/config
    - ${PLEX_BIND_2}:/movies
    - ${PLEX_BIND_3}:/tv
    ports:
    - ${BIND_ADDRESS}:${WEB_PORT}:32400
